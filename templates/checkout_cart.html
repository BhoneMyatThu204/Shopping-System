<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Checkout | ATOMIC</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --dark: #111111;
            --border: #e5e7eb;
            --blue: #2563eb;
            --green: #16a34a;
            --green-hover: #15803d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #333;
        }

        .navbar {
            background: var(--dark);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .navbar .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .checkout-container {
            display: flex;
            justify-content: center;
            padding: 0 1rem 4rem 1rem;
        }

        .card {
            background: white;
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .card h3 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            font-size: 1rem;
            transition: 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--blue);
        }

        .help-text {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 0.4rem;
            display: block;
        }

        .payment-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .payment-options input[type="radio"] {
            display: none;
        }

        .payment-options label {
            flex: 1 1 calc(33% - 10px);
            text-align: center;
            padding: 0.75rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            user-select: none;
        }

        .payment-options input[type="radio"]:checked+label {
            background-color: #eff6ff;
            border-color: var(--blue);
            color: var(--blue);
        }

        .payment-options input[type="radio"]#other:checked+label {
            background-color: #111;
            border-color: #111;
            color: white;
        }

        .btn-submit {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--green-hover);
        }

        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #6b7280;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <nav class="navbar"><a class="logo" href="/">ATOMIC</a></nav>

    <div class="checkout-container">
        <div class="card">
            <h3>Cart Checkout 🔒</h3>
            <form action="/pay_cart" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Shipping Address</label>
                    <input type="text" id="address" name="address" required placeholder="123 Developer Lane">
                </div>

                <!-- NEW: Order Note / Comment -->
                <div class="form-group">
                    <label>Order Note (Optional)</label>
                    <textarea name="order_note" rows="3"
                        placeholder="e.g. Please deliver in the afternoon..."></textarea>
                </div>

                <hr>
                <div class="form-group">
                    <label>Select Payment Method</label>
                    <div class="payment-options">
                        <input type="radio" name="payment_method" id="cod" value="cod" onchange="updatePaymentInput()"
                            checked>
                        <label for="cod">Cash on Delivery</label>
                        <input type="radio" name="payment_method" id="kbz" value="kbz" onchange="updatePaymentInput()">
                        <label for="kbz">KBZ Pay</label>
                        <input type="radio" name="payment_method" id="wave" value="wave"
                            onchange="updatePaymentInput()">
                        <label for="wave">Wave Money</label>
                        <input type="radio" name="payment_method" id="other" value="other"
                            onchange="updatePaymentInput()">
                        <label for="other">Credit Card</label>
                    </div>
                </div>

                <div class="form-group" id="account-group" style="display: none;">
                    <label id="account-label" for="account_info">Account Number</label>
                    <input type="text" id="account_info" name="account_info" placeholder="Enter details">
                    <span id="account-help" class="help-text"></span>
                </div>

                <button type="submit" class="btn-submit">Confirm Order</button>
                <a href="/cart" class="cancel-link">Back to Cart</a>
            </form>
        </div>
    </div>

    <script>
        function updatePaymentInput() {
            const selectedMethod = document.querySelector('input[name="payment_method"]:checked').value;
            const inputGroup = document.getElementById('account-group');
            const inputLabel = document.getElementById('account-label');
            const inputField = document.getElementById('account_info');
            const helpText = document.getElementById('account-help');

            if (selectedMethod === 'cod') {
                inputGroup.style.display = 'none';
                inputField.removeAttribute('required');
            } else {
                inputGroup.style.display = 'block';
                inputField.setAttribute('required', 'true');
                if (selectedMethod === 'other') {
                    inputLabel.innerText = "Credit Card Number";
                    inputField.placeholder = "XXXX XXXX XXXX XXXX";
                    inputField.maxLength = 19;
                    helpText.innerText = "Use 4242 4242 4242 4242 to test.";
                } else {
                    let methodName = document.querySelector(`label[for="${selectedMethod}"]`).innerText;
                    inputLabel.innerText = methodName + " Phone Number";
                    inputField.placeholder = "09 XXXXXXXX";
                    inputField.maxLength = 15;
                    helpText.innerText = "Enter the phone number registered to your mobile wallet.";
                }
            }
        }
        updatePaymentInput();
    </script>
</body>

</html>
