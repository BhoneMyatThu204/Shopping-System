<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🛍️ MyTech Store</a>
        </div>
    </nav>

    <!-- Checkout Form -->
    <div class="container d-flex justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 p-4">
                <h3 class="mb-4 text-center fw-bold">Secure Checkout 🔒</h3>

                <form action="/pay" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="John Doe">
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-bold">Shipping Address</label>
                        <input type="text" class="form-control" id="address" name="address" required
                            placeholder="123 Developer Lane">
                    </div>

                    <div class="mb-4">
                        <label for="card_number" class="form-label fw-bold">Credit Card Number</label>
                        <input type="text" class="form-control" id="card_number" name="card_number" required
                            placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
                        <div class="form-text text-muted">Use 4242 4242 4242 4242 to test a successful payment.</div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3">Complete Payment</button>
                    <div class="text-center">
                        <a href="/" class="text-decoration-none text-muted">Cancel and return to shop</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
